<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hub de Jogos - Duplas, Impostor & Mímica</title>
  
  <!-- Fontes Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
  
  <!-- Folhas de Estilo Modulares -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">

  <!-- PeerJS para Salas Virtuais Online via PIN (defer para carregamento não bloqueante) -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" defer></script>
</head>
<body>
  <div class="box">
    <!-- Barra Superior de Navegação com Botão Voltar -->
    <header class="top-nav" id="top-nav">
      <button class="btn-voltar" id="btn-voltar" style="display: none;" title="Voltar à tela anterior">
        <span>←</span> Voltar
      </button>
      <div class="brand-badge">Hub Games v2.1</div>
    </header>

    <!-- Título Principal -->
    <h1>🎭 Hub de Jogos</h1>
    <p id="sub">Como vocês vão jogar hoje?</p>

    <!-- Cartão Interativo com Flip 3D (pré-renderizado para evitar tela em branco) -->
    <main class="card" id="card" aria-live="polite">
      <div class="who" style="margin-bottom: 12px">Escolha como jogar</div>
      <div class="grid" style="grid-template-columns: 1fr; gap: 12px">
        <button class="modo" data-action="choose-env" data-val="offline" style="background: var(--p);">
          <span class="em">📱</span>
          <div>
            <b>Modo Offline (Mesmo celular)</b>
            <small>Passe o celular de mão em mão · Sem internet necessária</small>
          </div>
        </button>
        <button class="modo" data-action="choose-env" data-val="online" style="background: var(--b);">
          <span class="em">🌐</span>
          <div>
            <b>Modo Online (Salas Virtuais)</b>
            <small>Cada um no seu celular com PIN de 6 dígitos · Jogue com amigos de qualquer lugar!</small>
          </div>
        </button>
      </div>
    </main>

    <!-- Botões de Ação do Jogo -->
    <section class="game-controls">
      <button id="main" style="display:none"></button>
      <button class="sec" id="prox" style="display:none">Próxima pessoa</button>
      <button class="sec" id="revelar" style="display:none">Revelar duplas e impostores</button>
      <button class="sec" id="again" style="display:none">Sortear de novo</button>
      <button class="sec" id="trocar" style="display:none">Trocar tema</button>
    </section>
  </div>

  <!-- Scripts Modulares -->
  <script src="js/data.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/online.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
